---
- name: restart rpi-eeprom-update
  ansible.builtin.systemd:
    name: rpi-eeprom-update.service
    daemon_reload: true
    state: restarted

- name: rpi-eeprom-config apply
  ansible.builtin.command:
    cmd: "rpi-eeprom-config --apply {{ raspberrypi_bootloader_config_file }}"

- name: cloud-init apply
  ansible.builtin.shell:
    cmd: "script --quiet --return --command 'cloud-init --all-stages' /dev/null"

- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald.service
    daemon_reload: true
    state: restarted
  listen: flush journald

- name: journalctl flush
  ansible.builtin.command:
    cmd: "journalctl --flush"
  listen: flush journald
